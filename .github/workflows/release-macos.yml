name: Build Wichi macOS Release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find project file
        id: find-proj
        run: |
          CSPROJ=$(find . -maxdepth 4 -name "*.csproj" | head -n 1)
          if [ -z "$CSPROJ" ]; then
            echo "Error: No se encontró ningún archivo .csproj en el repositorio."
            exit 1
          fi
          echo "Encontrado: $CSPROJ"
          echo "path=$CSPROJ" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore "${{ steps.find-proj.outputs.path }}"

      - name: Publish Wichi macOS (Release)
        run: dotnet publish "${{ steps.find-proj.outputs.path }}" -c Release -r osx-arm64 --self-contained false -p:UseAppHost=false -o ./Wichi-macOS.app

      - name: Create tar.gz archive
        run: tar -czf Wichi-macOS.tar.gz Wichi-macOS.app/

      - name: Upload artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: Wichi-macOS
          path: Wichi-macOS.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: Wichi-macOS.tar.gz
